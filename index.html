<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProxyBrain – Godkännanden</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 24px; max-width: 800px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.sub { font-size: 13px; color: #888; margin-bottom: 24px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat { background: #1a1a1a; border-radius: 8px; padding: 12px; text-align: center; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.stat-num { font-size: 24px; font-weight: 500; }
.card { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.sender { font-size: 12px; color: #888; margin-bottom: 4px; }
.date { font-size: 11px; color: #555; margin-bottom: 10px; }
.original { font-size: 12px; color: #666; font-style: italic; border-left: 2px solid #333; padding-left: 8px; margin-bottom: 12px; }
.label { font-size: 12px; color: #888; font-weight: 500; margin-bottom: 6px; }
.response-box { background: #111; border-radius: 6px; padding: 10px; font-size: 13px; line-height: 1.6; margin-bottom: 8px; white-space: pre-wrap; }
textarea { width: 100%; background: #111; border: 0.5px solid #333; border-radius: 6px; padding: 10px; font-size: 13px; color: #e0e0e0; min-height: 80px; resize: vertical; margin-bottom: 10px; font-family: inherit; }
.btns { display: flex; gap: 8px; }
button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.15s; }
button:hover { opacity: 0.85; }
.btn-approve { background: #1a3a1a; color: #4ade80; border: 0.5px solid #2d5a2d; }
.btn-reject { background: #3a1a1a; color: #f87171; border: 0.5px solid #5a2d2d; }
.btn-refresh { background: #1a1a2a; color: #93c5fd; border: 0.5px solid #2d3a5a; flex: 0; padding: 10px 16px; margin-bottom: 16px; }
.empty { text-align: center; padding: 48px; color: #555; font-size: 14px; }
</style>
</head>
<body>
<h1>ProxyBrain</h1>
<p class="sub">Godkänn eller avvisa AI-klonens föreslagna svar</p>
<div class="stats">
  <div class="stat"><div class="stat-label">Väntande</div><div class="stat-num" id="cnt-pending">-</div></div>
  <div class="stat"><div class="stat-label">Godkända</div><div class="stat-num" id="cnt-approved">-</div></div>
  <div class="stat"><div class="stat-label">Avvisade</div><div class="stat-num" id="cnt-rejected">-</div></div>
</div>
<button class="btn-refresh" onclick="load()">↻ Uppdatera</button>
<div id="list"></div>
<script>
const URL = "https://kpmhgkznqntkyedpdevs.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwbWhna3pucW50a3llZHBkZXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MzU2MDMsImV4cCI6MjA5MzUxMTYwM30.tvuv0lPiIuS6wtaq8f7DDb4BS8moJOCsIYWp1r0HFF0";
const USER = "0649094c-c3ef-4baa-b12a-cc3426b0c93a";
let data = [];

async function load() {
  const r = await fetch(`${URL}/rest/v1/pending_approvals?user_id=eq.${USER}&order=created_at.desc`, {
    headers: { apikey: KEY, Authorization: `Bearer ${KEY}` }
  });
  data = await r.json();
  render();
}

function render() {
  const pending = data.filter(a => a.status === 'pending');
  const approved = data.filter(a => a.status === 'approved');
  const rejected = data.filter(a => a.status === 'rejected');
  document.getElementById('cnt-pending').textContent = pending.length;
  document.getElementById('cnt-approved').textContent = approved.length;
  document.getElementById('cnt-rejected').textContent = rejected.length;
  const list = document.getElementById('list');
  if (!pending.length) { list.innerHTML = '<div class="empty">Inga väntande svar</div>'; return; }
  list.innerHTML = pending.map(a => {
    const proposed = a.proposed_action?.response || '';
    const original = a.proposed_action?.original_message || '';
    const reasoning = a.reasoning || '';
    const senderMatch = reasoning.match(/Avsändare: ([^|]+)/);
    const sender = senderMatch ? senderMatch[1].trim() : 'Okänd';
    const date = new Date(a.created_at).toLocaleString('sv-SE');
    return `<div class="card">
      <div class="sender">✉ ${sender}</div>
      <div class="date">${date}</div>
      <div class="original">${original.slice(0,300)}${original.length>300?'...':''}</div>
      <div class="label">Föreslagen svar:</div>
      <div class="response-box">${proposed}</div>
      <textarea id="edit-${a.id}">${proposed}</textarea>
      <div class="btns">
        <button class="btn-approve" onclick="approve('${a.id}')">✓ Godkänn</button>
        <button class="btn-reject" onclick="reject('${a.id}')">✗ Avvisa</button>
      </div>
    </div>`;
  }).join('');
}

async function approve(id) {
  const edited = document.getElementById(`edit-${id}`).value;
  await fetch(`${URL}/rest/v1/pending_approvals?id=eq.${id}`, {
    method: 'PATCH',
    headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ status: 'approved', user_modification: edited })
  });
  load();
}

async function reject(id) {
  await fetch(`${URL}/rest/v1/pending_approvals?id=eq.${id}`, {
    method: 'PATCH',
    headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ status: 'rejected' })
  });
  load();
}

load();
</script>
</body>
</html>
